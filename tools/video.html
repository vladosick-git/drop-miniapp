<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ДРОП - запись видео</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* сцена 1920x1080 для видео в портфолио; управляется tools/record.js */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1920px; height: 1080px; overflow: hidden; background: #161716; color: #fff; font-family: 'Inter Tight', sans-serif; position: relative; }
  .left { position: absolute; left: 150px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; font-weight: 700; }
  .brand i { width: 56px; height: 56px; border-radius: 50%; background: #1452fe; display: grid; place-items: center; }
  .brand small { display: block; font-size: 17px; font-weight: 400; color: #8e8e93; margin-top: 2px; }
  .step { margin-top: 80px; min-height: 260px; }
  .step b { display: block; font-size: 58px; font-weight: 700; letter-spacing: -1.4px; line-height: 1.08; transition: opacity .35s, transform .35s; }
  .step p { font-size: 24px; color: #a6a6ab; margin-top: 20px; line-height: 1.4; transition: opacity .35s .05s, transform .35s .05s; }
  .step.out b, .step.out p { opacity: 0; transform: translateY(12px); }
  .dots { display: flex; gap: 10px; margin-top: 40px; }
  .dots i { width: 40px; height: 5px; border-radius: 3px; background: #2e2f33; transition: background .3s; }
  .dots i.on { background: #1452fe; }
  .phone { position: absolute; left: 1150px; top: 54px; width: 428px; height: 971px; border: 0; border-radius: 16px; background: #0f1213; transition: opacity .5s; }
  .web { position: absolute; left: 240px; top: 150px; width: 1440px; height: 832px; border: 0; border-radius: 10px; opacity: 0; transition: opacity .5s; pointer-events: none; }
  .webcap { position: absolute; left: 0; right: 0; top: 52px; text-align: center; font-size: 46px; font-weight: 700; letter-spacing: -1px; opacity: 0; transition: opacity .5s; }
  .webmode .left, .webmode .phone { opacity: 0; }
  .webmode .web, .webmode .webcap { opacity: 1; }
  .left { transition: opacity .5s; }
  .tap { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.45); border: 2px solid rgba(20,82,254,.9); pointer-events: none; opacity: 0; z-index: 9; }
  .tap.go { animation: tap .55s ease-out; }
  @keyframes tap { 0% { opacity: 1; transform: scale(.6); } 60% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.5); } }
  .end { position: absolute; inset: 0; background: #161716; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity .6s; z-index: 10; pointer-events: none; }
  .end b { font-size: 64px; font-weight: 700; letter-spacing: -1.5px; margin-top: 28px; }
  .end p { font-size: 26px; color: #a6a6ab; margin-top: 16px; }
  .end i { width: 96px; height: 96px; border-radius: 50%; background: #1452fe; display: grid; place-items: center; }
  .endmode .end { opacity: 1; }
</style>
</head>
<body>
<div class="left">
  <div class="brand"><i id="logo1"></i><div>ДРОП<small>Telegram Mini App магазина уличной одежды</small></div></div>
  <div class="step" id="step"><b id="t"></b><p id="d"></p></div>
  <div class="dots" id="dots"></div>
</div>
<iframe class="phone" id="phone" src="../index.html?frame=1&reset=1#/"></iframe>
<div class="webcap">Веб-админка для компьютера</div>
<iframe class="web" id="web"></iframe>
<div class="tap" id="tap"></div>
<div class="end"><i id="logo2"></i><b>ДРОП - Telegram Mini App</b><p>Каталог · корзина с промокодом · оплата · мобильная и веб-админка</p></div>
<script>
  const logo = `<svg viewBox="0 0 24 24" width="70%" height="70%"><path fill="#fff" d="M6.6 8.2c0-.5.3-.9.8-1.1L11.3 5c.4-.2.9-.2 1.3 0l4 2.1c.5.3.8.7.8 1.2v.6c0 .5-.3.9-.8 1.1L12.7 12c-.4.2-.9.2-1.3 0l-4-2.1c-.5-.3-.8-.7-.8-1.2z"/><path fill="none" stroke="#1452fe" stroke-width="1.1" stroke-linecap="round" d="M7.4 8.6c2.4-.9 6.2-1.5 9.2-.6"/><path fill="#fff" d="M6.6 13c0-.6.6-.9 1.1-.7l3.7 1.9c.4.2.9.2 1.3 0l3.6-1.9c.5-.3 1.1.1 1.1.7v1.1c0 .5-.3.9-.8 1.1L12.7 17.4c-.4.2-.9.2-1.3 0l-4-2.1c-.5-.3-.8-.7-.8-1.2z"/></svg>`;
  document.getElementById('logo1').innerHTML = logo; document.getElementById('logo2').innerHTML = logo;
  const N = 7;
  document.getElementById('dots').innerHTML = '<i></i>'.repeat(N);
  window.setStep = (i, t, d) => {
    const el = document.getElementById('step');
    el.classList.add('out');
    setTimeout(() => { document.getElementById('t').innerHTML = t; document.getElementById('d').innerHTML = d; el.classList.remove('out'); }, 350);
    document.querySelectorAll('.dots i').forEach((x, k) => x.classList.toggle('on', k <= i));
  };
  window.tapAt = (x, y) => { const t = document.getElementById('tap'); t.style.left = x + 'px'; t.style.top = y + 'px'; t.classList.remove('go'); void t.offsetWidth; t.classList.add('go'); };
  window.showWeb = () => { document.getElementById('web').src = '../admin.html'; setTimeout(() => document.body.classList.add('webmode'), 600); };
  window.showEnd = () => document.body.classList.add('endmode');
</script>
</body>
</html>
